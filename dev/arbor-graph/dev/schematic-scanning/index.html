<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Arbor — Building Graph</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #e0e0e0; font-family: 'Inter', 'Segoe UI', sans-serif; overflow: hidden; }

  #canvas-container { position: fixed; inset: 0; }

  #ui { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; }

  /* Header */
  #header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    background: linear-gradient(to bottom, rgba(10,10,15,0.95), transparent);
    display: flex; align-items: center; gap: 16px;
  }
  #header h1 { font-size: 16px; font-weight: 600; letter-spacing: 0.08em; color: #fff; }
  #header .subtitle { font-size: 12px; color: #666; }
  #stats { margin-left: auto; font-size: 11px; color: #555; letter-spacing: 0.05em; }

  /* Legend */
  #legend {
    position: absolute; bottom: 20px; left: 20px;
    background: rgba(10,10,15,0.85); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 12px 14px;
    pointer-events: auto;
  }
  #legend h3 { font-size: 10px; font-weight: 600; color: #555; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 11px; color: #aaa; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 20px; height: 2px; flex-shrink: 0; }

  /* Info panel */
  #panel {
    position: absolute; top: 64px; right: 20px;
    width: 240px;
    background: rgba(10,10,15,0.92); backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 16px;
    pointer-events: auto;
    opacity: 0; transform: translateX(10px);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  #panel.visible { opacity: 1; transform: translateX(0); }
  #panel-type-badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 10px;
  }
  #panel-label { font-size: 17px; font-weight: 600; color: #fff; margin-bottom: 4px; }
  #panel-id { font-size: 11px; color: #555; margin-bottom: 12px; font-family: monospace; }
  #panel-meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 11px; }
  #panel-meta .key { color: #555; }
  #panel-meta .val { color: #ccc; }
  #panel-close {
    position: absolute; top: 10px; right: 12px;
    background: none; border: none; color: #555; cursor: pointer;
    font-size: 16px; line-height: 1;
  }
  #panel-close:hover { color: #ccc; }

  /* Floor filter */
  #floor-filter {
    position: absolute; top: 64px; left: 20px;
    background: rgba(10,10,15,0.85); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 12px 14px;
    pointer-events: auto; max-height: calc(100vh - 160px); overflow-y: auto;
  }
  #floor-filter h3 { font-size: 10px; font-weight: 600; color: #555; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 8px; }
  .floor-btn {
    display: block; width: 100%; text-align: left;
    background: none; border: none; color: #888; cursor: pointer;
    font-size: 11px; padding: 4px 6px; border-radius: 4px;
    transition: background 0.1s, color 0.1s;
    white-space: nowrap;
  }
  .floor-btn:hover { background: rgba(255,255,255,0.05); color: #ccc; }
  .floor-btn.active { background: rgba(255,255,255,0.1); color: #fff; }
  .floor-btn.all { color: #4a90d9; }

  /* Controls hint */
  #hints {
    position: absolute; bottom: 20px; right: 20px;
    font-size: 10px; color: #444; text-align: right; line-height: 1.8;
  }
</style>
</head>
<body>
<div id="canvas-container"></div>

<div id="ui">
  <div id="header">
    <div>
      <h1>ARBOR · Bankside Yards</h1>
      <div class="subtitle">Building 1 — Room Graph Network</div>
    </div>
    <div id="stats">Loading...</div>
  </div>

  <div id="floor-filter">
    <h3>Floors</h3>
    <button class="floor-btn all active" data-floor="all">All Floors</button>
  </div>

  <div id="panel">
    <button id="panel-close">✕</button>
    <div id="panel-type-badge"></div>
    <div id="panel-label"></div>
    <div id="panel-id"></div>
    <div id="panel-meta"></div>
  </div>

  <div id="legend">
    <h3>Room Type</h3>
    <div class="legend-item"><div class="legend-dot" style="background:#4a90d9"></div> Office</div>
    <div class="legend-item"><div class="legend-dot" style="background:#9b9b9b"></div> Core (Lift/Stair)</div>
    <div class="legend-item"><div class="legend-dot" style="background:#7ed321"></div> Circulation</div>
    <div class="legend-item"><div class="legend-dot" style="background:#f5a623"></div> Plant</div>
    <div class="legend-item"><div class="legend-dot" style="background:#bd10e0"></div> Amenity</div>
    <div class="legend-item"><div class="legend-dot" style="background:#50e3c2"></div> Residential</div>
    <hr style="border-color:rgba(255,255,255,0.08);margin:8px 0">
    <div class="legend-item"><div class="legend-line" style="background:#3a5a8a"></div> Intra-floor edge</div>
    <div class="legend-item"><div class="legend-line" style="background:#e8a020;opacity:0.7"></div> Inter-floor edge</div>
  </div>

  <div id="hints">
    Drag to orbit · Scroll to zoom · Click node to inspect
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Colour palette ────────────────────────────────────────────────────────────
const TYPE_COLORS = {
  office:      0x4a90d9,
  core:        0x9b9b9b,
  circulation: 0x7ed321,
  plant:       0xf5a623,
  amenity:     0xbd10e0,
  residential: 0x50e3c2,
  external:    0x444444,
  unknown:     0x555555,
};
const TYPE_HEX = {
  office:      '#4a90d9',
  core:        '#9b9b9b',
  circulation: '#7ed321',
  plant:       '#f5a623',
  amenity:     '#bd10e0',
  residential: '#50e3c2',
  external:    '#444444',
  unknown:     '#555555',
};

// ── Scene ─────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0f);
document.getElementById('canvas-container').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a0f, 0.008);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(25, 30, 40);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 5;
controls.maxDistance = 200;
controls.target.set(10, 15, 10);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(30, 60, 30);
scene.add(dirLight);

// ── Layout constants ──────────────────────────────────────────────────────────
const SCALE_XY = 20;   // normalised 0-1 → world units
const SCALE_Z  = 1.0;  // z (metres) → world units (already in metres)
const FLOOR_W  = 22;   // floor plate width/depth in world units
const FLOOR_H  = 0.12; // floor plate thickness
const NODE_R   = 0.28; // sphere radius

// ── Graph data ────────────────────────────────────────────────────────────────
let graphData = null;
const nodeMeshes = [];       // {mesh, node}
const floorGroups = {};      // floor label → THREE.Group
let selectedMesh = null;

function worldPos(node) {
  return new THREE.Vector3(
    node.x * SCALE_XY,
    node.z * SCALE_Z,
    node.y * SCALE_XY
  );
}

function buildScene(graph) {
  // Floor plates
  for (const fl of graph.floors) {
    const geo = new THREE.BoxGeometry(FLOOR_W, FLOOR_H, FLOOR_W);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x1a1a2e,
      transparent: true,
      opacity: 0.55,
      roughness: 0.8,
    });
    const mesh = new THREE.Mesh(geo, mat);
    const y = fl.z * SCALE_Z;
    mesh.position.set(FLOOR_W / 2, y - FLOOR_H / 2, FLOOR_W / 2);
    mesh.userData = { floorPlate: true, floorLabel: fl.label };
    scene.add(mesh);

    // Floor label sprite (simple canvas texture)
    const sprite = makeTextSprite(fl.label, '#555577');
    sprite.position.set(-1.5, y, FLOOR_W + 0.5);
    scene.add(sprite);
  }

  // Build a lookup for quick node access
  const nodeById = {};
  for (const n of graph.nodes) nodeById[n.id] = n;

  // Edges (draw before nodes so nodes render on top)
  const intraPoints = [];
  const interPoints = [];

  for (const e of graph.edges) {
    const a = nodeById[e.source];
    const b = nodeById[e.target];
    if (!a || !b) continue;
    const pa = worldPos(a);
    const pb = worldPos(b);
    if (e.type === 'inter') {
      interPoints.push(pa, pb);
    } else {
      intraPoints.push(pa, pb);
    }
  }

  if (intraPoints.length > 0) {
    const geo = new THREE.BufferGeometry().setFromPoints(intraPoints);
    const mat = new THREE.LineBasicMaterial({ color: 0x3a5a8a, transparent: true, opacity: 0.5 });
    scene.add(new THREE.LineSegments(geo, mat));
  }
  if (interPoints.length > 0) {
    const geo = new THREE.BufferGeometry().setFromPoints(interPoints);
    const mat = new THREE.LineBasicMaterial({ color: 0xe8a020, transparent: true, opacity: 0.45 });
    scene.add(new THREE.LineSegments(geo, mat));
  }

  // Node spheres
  const sphereGeo = new THREE.SphereGeometry(NODE_R, 12, 8);

  for (const n of graph.nodes) {
    const color = TYPE_COLORS[n.type] ?? TYPE_COLORS.unknown;
    const mat = new THREE.MeshStandardMaterial({
      color,
      emissive: color,
      emissiveIntensity: 0.15,
      roughness: 0.4,
      metalness: 0.1,
    });
    const mesh = new THREE.Mesh(sphereGeo, mat.clone());
    const pos = worldPos(n);
    mesh.position.copy(pos);
    mesh.userData = { node: n, baseColor: color, baseEmissive: 0.15 };
    scene.add(mesh);
    nodeMeshes.push(mesh);
  }

  // Stats
  document.getElementById('stats').textContent =
    `${graph.nodes.length} rooms · ${graph.edges.length} edges · ${graph.floors.length} floors`;

  // Floor filter buttons
  const filterEl = document.getElementById('floor-filter');
  for (const fl of [...graph.floors].reverse()) {
    const btn = document.createElement('button');
    btn.className = 'floor-btn';
    btn.textContent = fl.label;
    btn.dataset.floor = String(fl.level);
    btn.addEventListener('click', () => filterFloor(String(fl.level), btn));
    filterEl.appendChild(btn);
  }
}

function filterFloor(level, btn) {
  const allBtns = document.querySelectorAll('.floor-btn');
  allBtns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  for (const { mesh, ..._ } of nodeMeshes.map(m => ({ mesh: m }))) {
    const n = mesh.userData.node;
    if (level === 'all') {
      mesh.visible = true;
    } else {
      mesh.visible = String(n.floor) === level;
    }
  }
}

// ── Text sprite helper ────────────────────────────────────────────────────────
function makeTextSprite(text, color = '#888888') {
  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 24px Inter, sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(text, 4, 40);

  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0.7 });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(6, 1.5, 1);
  return sprite;
}

// ── Raycaster / selection ─────────────────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('click', e => {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);

  const hits = raycaster.intersectObjects(nodeMeshes);
  if (hits.length > 0) {
    selectNode(hits[0].object);
  } else {
    clearSelection();
  }
});

function selectNode(mesh) {
  // Deselect previous
  if (selectedMesh && selectedMesh !== mesh) {
    const prev = selectedMesh.userData;
    selectedMesh.material.emissiveIntensity = prev.baseEmissive;
    selectedMesh.material.color.setHex(prev.baseColor);
    selectedMesh.scale.setScalar(1);
  }

  selectedMesh = mesh;
  mesh.material.emissiveIntensity = 0.8;
  mesh.scale.setScalar(1.6);

  const n = mesh.userData.node;
  showPanel(n);
}

function clearSelection() {
  if (selectedMesh) {
    selectedMesh.material.emissiveIntensity = selectedMesh.userData.baseEmissive;
    selectedMesh.scale.setScalar(1);
    selectedMesh = null;
  }
  document.getElementById('panel').classList.remove('visible');
}

function showPanel(node) {
  const panel = document.getElementById('panel');
  const badge = document.getElementById('panel-type-badge');
  const color = TYPE_HEX[node.type] ?? '#555';

  badge.textContent = node.type;
  badge.style.background = color + '33';
  badge.style.color = color;

  document.getElementById('panel-label').textContent = node.label;
  document.getElementById('panel-id').textContent = node.id;

  const floorLabel = graphData.floors.find(f => String(f.level) === String(node.floor))?.label ?? `Level ${node.floor}`;
  const neighbours = graphData.edges
    .filter(e => e.source === node.id || e.target === node.id)
    .map(e => e.source === node.id ? e.target : e.source);

  document.getElementById('panel-meta').innerHTML = `
    <span class="key">Floor</span><span class="val">${floorLabel}</span>
    <span class="key">Type</span><span class="val">${node.type}</span>
    <span class="key">Position</span><span class="val">${(node.x).toFixed(2)}, ${(node.y).toFixed(2)}</span>
    <span class="key">Connections</span><span class="val">${neighbours.length}</span>
  `;

  panel.classList.add('visible');
}

document.getElementById('panel-close').addEventListener('click', clearSelection);
document.querySelector('.floor-btn.all').addEventListener('click', e => {
  document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
  e.target.classList.add('active');
  nodeMeshes.forEach(m => { m.visible = true; });
});

// ── Animate ───────────────────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Load data and start ───────────────────────────────────────────────────────
fetch('./graph.json')
  .then(r => r.json())
  .then(data => {
    graphData = data;
    buildScene(data);
    animate();
  })
  .catch(err => {
    document.getElementById('stats').textContent = 'Error loading graph.json — serve with: python -m http.server 8080';
    console.error(err);
  });
</script>
</body>
</html>
